name: Render CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_email:
        description: "Envoyer le CV par email"
        type: boolean
        default: false

env:
  PDF: build/CV-Lewis-Hounkpevi.pdf

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Render CV
        env:
          VILLE: ${{ secrets.VILLE }}
          TEL: ${{ secrets.TEL }}
        # --strict-env fait échouer le build si un secret manque, plutôt que de publier
        # un CV avec la ville ou le téléphone vides.
        run: uv run autocv build --strict-env --output "$PDF"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: ${{ env.PDF }}
          if-no-files-found: error

      # Un seul envoi, jamais depuis une pull request.
      - name: Send CV by email
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.send_email)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: uv run autocv send --pdf "$PDF"
