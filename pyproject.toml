[project]
name = "autocv"
version = "0.1.0"
description = "Génération du CV en PDF (Typst) et envoi par email"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typst>=0.13",
]

[project.scripts]
autocv = "autocv.cli:main"

[dependency-groups]
dev = [
    "pypdf>=4.3",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocv"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Le CV est en français : les caractères typographiques (tiret demi-cadratin, apostrophe
# courbe) sont voulus dans le contenu et dans les tests qui l'exercent.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
